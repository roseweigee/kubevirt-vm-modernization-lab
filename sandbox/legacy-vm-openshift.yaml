# Same legacy app, for Red Hat OpenShift Virtualization (Developer Sandbox).
# Apply in your own project:  oc apply -f sandbox/legacy-vm-openshift.yaml
#
# Instead of importing a disk over HTTP, the root disk is cloned from the Fedora
# boot source that OpenShift Virtualization publishes as a DataSource.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: legacy-app
spec:
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: legacy-app-rootdisk
      spec:
        sourceRef:
          kind: DataSource
          name: fedora
          namespace: openshift-virtualization-os-images
        storage:
          resources:
            requests:
              storage: 30Gi
  template:
    metadata:
      labels:
        app: legacy-app
        tier: vm
    spec:
      domain:
        cpu:
          cores: 1
        memory:
          guest: 2Gi
        devices:
          disks:
            - name: rootdisk
              disk: {bus: virtio}
            - name: cloudinitdisk
              disk: {bus: virtio}
          interfaces:
            - name: default
              masquerade: {}
              # fixed MAC: cloud-init writes the guest's network config for this MAC on
              # first boot; a new random MAC on restart would leave the NIC unconfigured
              macAddress: "02:6b:76:00:00:01"
              ports:
                - port: 8080
      networks:
        - name: default
          pod: {}
      readinessProbe:
        httpGet:
          port: 8080
        initialDelaySeconds: 30
        periodSeconds: 5
        failureThreshold: 60
      volumes:
        - name: rootdisk
          dataVolume:
            name: legacy-app-rootdisk
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              user: fedora
              password: kubevirt-lab
              chpasswd: {expire: false}
              write_files:
                - path: /usr/local/bin/legacy-app.sh
                  permissions: "0755"
                  content: |
                    #!/bin/bash
                    mkdir -p /var/lib/legacy /srv/www
                    n=$(( $(cat /var/lib/legacy/bootcount 2>/dev/null || echo 0) + 1 ))
                    echo "$n" > /var/lib/legacy/bootcount
                    echo "legacy-app running in a VM on OpenShift Virtualization (boot #$n)" > /srv/www/index.html
                    exec python3 -m http.server 8080 --directory /srv/www
                - path: /etc/systemd/system/legacy-app.service
                  content: |
                    [Unit]
                    Description=Legacy app (lab)
                    After=network-online.target
                    [Service]
                    ExecStart=/usr/local/bin/legacy-app.sh
                    Restart=on-failure
                    [Install]
                    WantedBy=multi-user.target
              runcmd:
                - setenforce 0 || true
                - systemctl daemon-reload
                - systemctl enable --now legacy-app.service
---
apiVersion: v1
kind: Service
metadata:
  name: legacy-app
spec:
  selector:
    app: legacy-app
    tier: vm
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: legacy-app
spec:
  to:
    kind: Service
    name: legacy-app
  port:
    targetPort: http
  tls:
    termination: edge
